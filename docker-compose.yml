# Usage: DATA_ROOT=/path/to/densea_aggregated RUNS_DIR=/path/to/runs docker compose up -d --build
services:
  rtdetrv2:
    build: .
    image: densea-rtdetrv2:1.0
    container_name: densea_rtdetrv2
    shm_size: 32gb
    ipc: host
    volumes:
      - ./rtdetrv2_pytorch:/app/RT-DETR
      - ${DATA_ROOT:?set DATA_ROOT}:/data:ro
      - ${RUNS_DIR:?set RUNS_DIR}:/runs
    ports:
      - "6007:6007"   # TensorBoard
    environment:
      - PYTHONUNBUFFERED=1
      - FAST_COCOEVAL=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    stdin_open: true
    tty: true
