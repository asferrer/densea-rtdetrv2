services:
  rt-detrv2:
    build: .
    image: rt_detrv2:v1.0
    container_name: rt_detrv2
    shm_size: 80gb  # Aumentado para 96GB RAM total (shared memory para PyTorch)
    deploy:
      resources:
        limits:
          memory: 80g  # 80GB de 96GB disponibles (dejar 16GB para Windows)
          cpus: "16.0"  # Core Ultra 9 285K tiene 24 cores (usar 20)
    volumes:
      - ./rtdetrv2_pytorch:/app/RT-DETR # Monta el código fuente en el contenedor
      - C:\Users\aleja\SynologyDrive\Datasets\Deteccion_Residuos:/app/RT-DETR/dataset # Monta el dataset en el contenedor
      - C:\Users\aleja\SynologyDrive\Modelos\Deteccion_residuos\RT-DETRv2\Entrenamientos\Experimentos con datos sintéticos:/app/RT-DETR/experiment_output # Monta la carpeta de experimentos para guardar resultados
    ports:
      - "6007:6007"  # Mapea el puerto de TensorBoard
      - "8502:8502"  # Puerto para streamlit
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
      - NCCL_DEBUG=INFO
    runtime: nvidia
    ipc: host
    stdin_open: true
    tty: true