
print_freq: 100
output_dir: './logs'
checkpoint_freq: 1


sync_bn: True
find_unused_parameters: False


use_amp: False
scaler:
  type: GradScaler
  enabled: True


use_ema: True
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 2000

early_stopping_patience: 15

early_stopping_min_delta: 0.01

early_stopping_metric: 'coco_eval_bbox'

enable_per_class_metrics: True