# =============================================================================
# RT-DETRv2 (PResNet-50vd) training configuration for DenSea-Aggregated
# =============================================================================
# Template used by tools/make_densea_config.py. Placeholders (dollar-brace names) are filled
# in at generation time; do not train from this file directly.
# =============================================================================

__include__: [
  '${INCLUDE_PREFIX}/configs/dataset/densea_detection.yml',
  '${INCLUDE_PREFIX}/configs/runtime.yml',
  '${INCLUDE_PREFIX}/configs/rtdetrv2/include/dataloader.yml',
  '${INCLUDE_PREFIX}/configs/rtdetrv2/include/optimizer_v2.yml',
  '${INCLUDE_PREFIX}/configs/rtdetrv2/include/rtdetrv2_r50vd.yml',
]

# =============================================================================
# Output Directory
# =============================================================================
output_dir: ${OUTPUT_DIR}

# =============================================================================
# Dataset Configuration
# =============================================================================
# DenSea-Aggregated has 8 classes: Bottle, Can, Fishing_Net, Glove, Mask,
# Metal_Debris, Plastic_Debris, Tire.
num_classes: ${NUM_CLASSES}

# =============================================================================
# Model Configuration (common to all experiments)
# =============================================================================
PResNet:
  depth: 50
  freeze_at: 2          # Freeze the first 2 stages
  freeze_norm: True     # Freeze BatchNorm layers
  pretrained: True

HybridEncoder:
  in_channels: [512, 1024, 2048]
  hidden_dim: 256
  expansion: 1.0

RTDETRTransformerv2:
  num_layers: 6
  num_queries: 150
  num_denoising: 100
  label_noise_ratio: 0.3
  box_noise_scale: 0.7
  num_points: [4, 4, 4]
  cross_attn_method: default
  query_select_method: default

# =============================================================================
# Training Configuration
# =============================================================================
epoches: ${EPOCHS}

# =============================================================================
# Optimizer Configuration (common to all experiments)
# =============================================================================
optimizer:
  type: AdamW
  params:
    # Backbone parameters (excluding norm layers): 10x lower LR
    -
      params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.000005
    # Encoder/Decoder norm layers - no weight decay
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.0

  lr: 0.00005           # Main learning rate for encoder/decoder
  betas: [0.9, 0.999]
  weight_decay: 0.05    # Strong regularization

lr_scheduler:
  type: CosineAnnealingLR
  T_max: ${EPOCHS}
  eta_min: 0.00001

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 2000   # iterations

# =============================================================================
# Training Techniques
# =============================================================================
use_amp: True             # Automatic Mixed Precision
use_ema: True             # Exponential Moving Average
use_focal_loss: True      # Focal Loss for class imbalance
clip_max_norm: 1.0        # Gradient clipping

ema:
  type: ModelEMA
  decay: 0.9998
  warmups: 2000

# =============================================================================
# Checkpointing
# =============================================================================
checkpoint_freq: 20        # Save intermediate checkpoint every N epochs
print_freq: 50             # Print training stats every N iterations

# =============================================================================
# Early Stopping
# =============================================================================
early_stopping_patience: 20
early_stopping_min_delta: 0.001
early_stopping_metric: 'coco_eval_bbox'

# =============================================================================
# Train Dataloader
# =============================================================================
train_dataloader:
  dataset:
    type: MultiDirCocoDetection
    image_dir:
${IMAGE_DIRS}
    anno_path: "${TRAIN_ANNO_PATH}"
    transforms:
      ops:
        # 1. Convert to Tensor FIRST
        - {type: ToImage}

        # 2. Geometric transforms (affect image and boxes)
        - {type: RandomRotation, degrees: 15, p: 0.4}
        - {type: RandomZoomOut, fill: 0, p: 0.3}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: RandomHorizontalFlip, p: 0.5}
        - {type: Resize, size: [640, 640]}

        # 3. Color transforms (affect only image)
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomGaussianBlur, kernel_size: 3, sigma: [0.1, 1.5], p: 0.3}
        - {type: RandomNoise, mean: 0, std: 0.005, p: 0.3}

        # 4. Cleanup and final conversion
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ToDtype, dtype: torch.float32, scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: 180
        ops: ['RandomPhotometricDistort', 'RandomGaussianBlur', 'RandomIoUCrop']

  collate_fn:
    type: BatchImageCollateFuncion
    scales: [640, 672, 704, 736, 768, 800]
    stop_epoch: 180

  shuffle: True
  total_batch_size: 32         # ~31 GB of VRAM with AMP and 150 queries (RTX 5090, 32 GB)
  num_workers: 8               
  drop_last: True

# =============================================================================
# Validation Dataloader
# =============================================================================
val_dataloader:
  dataset:
    type: MultiDirCocoDetection
    image_dir:
${VAL_IMAGE_DIRS}
    remap_mscoco_category: False
    anno_path: "${VAL_ANNO_PATH}"
    transforms:
      ops:
        # 1. Convert to Tensor FIRST
        - {type: ToImage}
        # 2. Resize
        - {type: Resize, size: [640, 640]}
        # 3. Cleanup and convert
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ToDtype, dtype: torch.float32, scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  total_batch_size: 1
  num_workers: 8
